# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: Strongroom
options:
  bundleIdPrefix: com.example          # change to your own reverse domain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""               # paste your Apple Team ID, or pick it in Xcode
    CODE_SIGN_STYLE: Automatic

targets:
  Strongroom:
    type: application
    platform: iOS
    sources: [Strongroom]
    info:
      path: Strongroom/Info.plist
      properties:
        CFBundleDisplayName: Strongroom
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.strongroom
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES

  StrongroomTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StrongroomTests]
    dependencies:
      - target: Strongroom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Strongroom:
    build:
      targets:
        Strongroom: all
        StrongroomTests: [test]
    test:
      targets: [StrongroomTests]
